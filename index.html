<body>
  <div id="app"></div>

  <div class="toast-stack" id="toasts"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const cfg = window.DONORLINK_CONFIG || {};
const ready = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_URL.includes('PASTE_') && !cfg.SUPABASE_ANON_KEY.includes('PASTE_');
const supabase = ready ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
const app = document.getElementById('app');
const modal = document.getElementById('modal');
const BLOODS=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const state={session:null,profile:null,requests:[],responses:[],orgs:[],notifications:[],confirmations:[],reports:[],view:'home',loading:false,authMode:'login',filters:{blood:'all',city:''},coords:null};

const tMap={
 en:{home:'Home',requests:'Requests',organizations:'Organizations',profile:'Profile',create:'Create request',donate:'I want to donate',need:'I need blood',welcome:'Blood support, built around trust.',nearby:'Requests you can help with',active:'Active requests',matched:'Matched',fulfilled:'Fulfilled',notifications:'Notifications',logout:'Sign out',available:'Available',urgent_only:'Urgent only',unavailable:'Unavailable'},
 hi:{home:'होम',requests:'रिक्वेस्ट',organizations:'संस्थाएँ',profile:'प्रोफ़ाइल',create:'रक्त अनुरोध बनाएं',donate:'मैं रक्तदान करना चाहता/चाहती हूँ',need:'मुझे रक्त चाहिए',welcome:'विश्वास पर आधारित रक्त सहायता।',nearby:'जिन अनुरोधों में आप मदद कर सकते हैं',active:'सक्रिय अनुरोध',matched:'मैच हुए',fulfilled:'पूर्ण',notifications:'सूचनाएँ',logout:'साइन आउट',available:'उपलब्ध',urgent_only:'केवल अत्यावश्यक',unavailable:'उपलब्ध नहीं'},
 gu:{home:'હોમ',requests:'વિનંતીઓ',organizations:'સંસ્થાઓ',profile:'પ્રોફાઇલ',create:'રક્ત વિનંતી બનાવો',donate:'હું રક્તદાન કરવા માંગું છું',need:'મને રક્ત જોઈએ છે',welcome:'વિશ્વાસ પર આધારિત રક્ત સહાય.',nearby:'તમે મદદ કરી શકો તેવી વિનંતીઓ',active:'સક્રિય વિનંતીઓ',matched:'મેચ થયેલ',fulfilled:'પૂર્ણ',notifications:'સૂચનાઓ',logout:'સાઇન આઉટ',available:'ઉપલબ્ધ',urgent_only:'ફક્ત તાત્કાલિક',unavailable:'ઉપલબ્ધ નથી'}
};
const tr=k=>(tMap[state.profile?.preferred_language||'en']||tMap.en)[k]||tMap.en[k]||k;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=d=>{if(!d)return '—';const x=new Date(d);return isNaN(x)?'—':x.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})};
const initials=n=>(n||'DL').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3400)}
function setBusy(v){state.loading=v;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=v)}
function bloodOptions(val=''){return BLOODS.map(b=>`<option ${b===val?'selected':''}>${b}</option>`).join('')}
function navButton(view,ico,label){return `<button data-view="${view}" class="${state.view===view?'active':''}"><span>${ico}</span>${label}</button>`}

if(!ready){
 app.innerHTML=`<div class="setup card"><div class="brand"><div class="brand-mark">♥</div><div>DonorLink Global</div></div><h1>One small setup step remains</h1><p>Edit <code>config.js</code> and paste your Supabase Project URL and anon/publishable key. Then refresh this page.</p><div class="notice warn">Never paste the Supabase <b>service_role</b> key into this app. Only the public anon/publishable key belongs in <code>config.js</code>.</div><p class="muted small">Run <code>schema.sql</code> in your new Supabase project first. Full instructions are in README.md.</p></div>`;
} else {
 boot();
}

async function boot(){
 const {data:{session}}=await supabase.auth.getSession(); state.session=session;
 supabase.auth.onAuthStateChange(async(event,session)=>{state.session=session;if(event==='PASSWORD_RECOVERY') return passwordRecovery();if(session){await refreshAll()}else{clearState();render()}});
 if(session) await refreshAll(); else render();
}
function clearState(){Object.assign(state,{profile:null,requests:[],responses:[],orgs:[],notifications:[],confirmations:[],reports:[],view:'home'})}
async function refreshAll(){
 if(!state.session)return;
 try{
  const uid=state.session.user.id;
  const p=await supabase.from('profiles').select('*').eq('id',uid).single();
  if(p.error) throw p.error; state.profile=p.data;
  const [rq,rs,og,no,dc]=await Promise.all([
   supabase.from('blood_requests').select('*').order('created_at',{ascending:false}).limit(150),
   supabase.from('donor_responses').select('*').order('created_at',{ascending:false}).limit(200),
   supabase.from('organizations').select('*').order('created_at',{ascending:false}).limit(100),
   supabase.from('notifications').select('*').order('created_at',{ascending:false}).limit(50),
   supabase.from('donation_confirmations').select('*').order('created_at',{ascending:false}).limit(100)
  ]);
  state.requests=rq.data||[];state.responses=rs.data||[];state.orgs=og.data||[];state.notifications=no.data||[];state.confirmations=dc.data||[];
  if(state.profile.role==='admin'){const ar=await supabase.from('abuse_reports').select('*').order('created_at',{ascending:false}).limit(100);state.reports=ar.data||[]}
  render();
 }catch(e){toast(e.message||'Could not load account','error');render()}
}
function render(){
 if(!state.session||!state.profile)return renderAuth();
 const unread=state.notifications.filter(n=>!n.is_read).length;
 app.innerHTML=`
 <header class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brand-mark">♥</div><div>DonorLink Global<div class="brand-sub">Free • Voluntary • Privacy-first</div></div></div>
  <div class="spacer"></div>
  <button class="pill-btn" data-action="language">🌐 <span>${(state.profile.preferred_language||'en').toUpperCase()}</span></button>
  <button class="icon-btn" data-action="notifications" aria-label="Notifications">🔔${unread?`<b class="count">${unread>9?'9+':unread}</b>`:''}</button>
  <button class="btn primary" data-action="new-request">+ ${tr('create')}</button>
 </div></header>
 <div class="shell">
  <aside class="side"><nav class="nav">
   ${navButton('home','⌂',tr('home'))}${navButton('requests','🩸',tr('requests'))}${navButton('organizations','🏥',tr('organizations'))}${state.profile.role==='admin'?navButton('admin','🛡️','Admin'):''}${navButton('profile','👤',tr('profile'))}
  </nav><div class="side-card"><strong>Blood is never for sale.</strong><p>DonorLink coordinates voluntary help. Final donor eligibility, compatibility, collection and transfusion belong to authorized blood services.</p></div></aside>
  <main class="page">${renderView()}<div class="footer">DonorLink Global • Built to help people connect safely • Not a blood bank or medical eligibility service</div></main>
 </div>
 <nav class="mobile-nav">${navButton('home','⌂',tr('home'))}${navButton('requests','🩸',tr('requests'))}${navButton('organizations','🏥','Orgs')}${state.profile.role==='admin'?navButton('admin','🛡️','Admin'):navButton('profile','👤',tr('profile'))}${state.profile.role==='admin'?navButton('profile','👤',tr('profile')):navButton('safety','✓','Safety')}</nav>`;
 bind();
}
function renderView(){switch(state.view){case'requests':return renderRequests();case'organizations':return renderOrganizations();case'profile':return renderProfile();case'admin':return renderAdmin();case'safety':return renderSafety();default:return renderHome()}}
function renderHome(){
 const mine=state.requests.filter(r=>r.created_by===state.profile.id);const open=state.requests.filter(r=>['open','matched'].includes(r.status)&&new Date(r.needed_by)>new Date());
 const matched=mine.filter(r=>r.status==='matched').length,fulfilled=mine.filter(r=>r.status==='fulfilled').length;
 let relevant=open.slice(0,6);
 if(state.profile.role==='donor'&&state.profile.blood_group) relevant=open.filter(r=>r.blood_group===state.profile.blood_group&&r.id&&r.created_by!==state.profile.id).slice(0,6);
 return `<section class="hero"><span class="eyebrow">♥ Human to human</span><h1>${esc(tr('welcome'))}</h1><p>Connect voluntary donors with real blood needs while keeping donor contact details private until a donor chooses to help.</p><div class="hero-actions"><button class="btn primary" data-action="new-request">🩸 ${tr('need')}</button>${state.profile.role==='donor'?`<button class="btn outline" data-view="requests">❤️ ${tr('donate')}</button>`:`<button class="btn outline" data-view="profile">Become / manage donor profile</button>`}</div><div class="hero-note">Free to use. No buying or selling blood. Final medical eligibility is decided by the authorized hospital or blood centre.</div></section>

date my location':'Use my current location'}</button></div></div>`:''}<div class="field"><label>Language</label><select name="preferred_language"><option value="en" ${p.preferred_language==='en'?'selected':''}>English</option><option value="hi" ${p.preferred_language==='hi'?'selected':''}>हिन्दी</option><option value="gu" ${p.preferred_language==='gu'?'selected':''}>ગુજરાતી</option></select></div><button class="btn primary" type="submit">Save profile</button></form></div><div class="section grid two"><div class="card"><h3>Privacy & safety</h3><p class="muted small">Your exact donor location is used for matching and is not displayed in the request feed. Phone is only disclosed to a request participant after acceptance.</p><button class="link" data-view="safety">Read safety principles →</button></div><div class="card"><h3>Account</h3><p class="muted small">Deleting your account removes the authentication user and linked DonorLink data through database cascades.</p><button class="btn outline danger" data-action="delete-account">Delete my account</button><button class="btn ghost" data-action="logout">${tr('logout')}</button></div></div></section>`;

function renderSafety(){return `<section><div class="hero"><span class="eyebrow">Safety first</span><h1>Coordinate help. Never bypass medical screening.</h1><p>DonorLink helps people find willing donors and verified organizations. It does not decide whether a person is medically eligible to donate or whether a blood product is suitable for a recipient.</p></div><div class="section grid two"><div class="card"><h3>For donors</h3><p class="muted">Never pay to donate. Donate only through an appropriate hospital or authorized blood collection service. Follow their screening and deferral instructions.</p></div><div class="card"><h3>For requesters</h3><p class="muted">Never ask donors to transfer money or meet at a private location for blood collection. Keep the request connected to a hospital/blood centre.</p></div><div class="card"><h3>Privacy</h3><p class="muted">Donor coordinates are used for matching but not listed publicly. Contact details are disclosed only after a response is accepted.</p></div><div class="card"><h3>International use</h3><p class="muted">Donation eligibility and collection rules differ between countries. The local authorized blood service always has the final decision.</p></div></div></section>`}

 app.innerHTML=`<div class="auth-wrap"><section class="auth-art"><div class="brand"><div class="brand-mark" style="background:rgba(255,255,255,.16);box-shadow:none">♥</div><div>DonorLink Global</div></div><h1>One request.<br>One donor.<br>One human connection.</h1><p>A free international platform for voluntary donors, patients, families, hospitals, blood centres and humanitarian organizations.</p><div class="principles"><span>🔒 Privacy first</span><span>🏥 Hospital-linked</span><span>🌍 International</span><span>💸 No blood selling</span></div></section><section class="auth-panel"><div class="auth-box"><span class="eyebrow">Welcome</span><h2 style="font-size:2rem;margin:10px 0 4px">${state.authMode==='login'?'Sign in':'Create your account'}</h2><p class="muted">${state.authMode==='login'?'Continue to your DonorLink dashboard.':'Choose your role. You can register an organization after signup.'}</p><div class="auth-tabs"><button data-auth-tab="login" class="${state.authMode==='login'?'active':''}">Sign in</button><button data-auth-tab="register" class="${state.authMode==='register'?'active':''}">Register</button></div>${state.authMode==='login'?loginForm():registerForm()}<div class="notice" style="margin-top:16px">DonorLink does not sell blood, charge patients to find donors, or replace medical screening.</div></div></section></div>`;bind();

function bind(){
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})});
 document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.authTab;renderAuth()});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));
 document.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>offerHelp(b.dataset.help));
 document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>manageResponses(b.dataset.manage));
 document.querySelectorAll('[data-response-cancel]').forEach(b=>b.onclick=()=>updateResponse(b.dataset.responseCancel,'cancelled'));
 document.querySelectorAll('[data-request-status]').forEach(b=>b.onclick=()=>{const[id,s]=b.dataset.requestStatus.split('|');updateRequestStatus(id,s)});
 document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportRequest(b.dataset.report));
 document.querySelectorAll('[data-org-review]').forEach(b=>b.onclick=()=>{const[id,s]=b.dataset.orgReview.split('|');reviewOrg(id,s)});
 const fb=document.getElementById('filterBlood');if(fb)fb.onchange=()=>{state.filters.blood=fb.value;render()};const fc=document.getElementById('filterCity');if(fc)fc.oninput=()=>{state.filters.city=fc.value;clearTimeout(window._f);window._f=setTimeout(render,250)};
 const lf=document.getElementById('loginForm');if(lf)lf.onsubmit=login;const rf=document.getElementById('registerForm');if(rf)rf.onsubmit=register;const pf=document.getElementById('profileForm');if(pf)pf.onsubmit=saveProfile;

async function action(a){
 if(a==='new-request')return newRequestModal();if(a==='new-org')return newOrgModal();if(a==='logout'){await supabase.auth.signOut();return}if(a==='notifications')return notificationsModal();if(a==='language')return languageModal();if(a==='profile-location')return getProfileLocation();if(a==='delete-account')return deleteAccount();if(a==='forgot')return forgotPassword();
}
async function login(e){e.preventDefault();setBusy(true);const f=new FormData(e.currentTarget);const {error}=await supabase.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});setBusy(false);if(error)toast(error.message,'error')}

async function forgotPassword(){const email=prompt('Enter your account email:');if(!email)return;const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)toast(error.message,'error');else toast('Password reset email sent.','success')}
function passwordRecovery(){showModal('Set new password',`<form id="recoveryForm" class="form"><div class="field"><label>New password</label><input name="password" type="password" minlength="8" required></div><button class="btn primary" type="submit">Update password</button></form>`);document.getElementById('recoveryForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const{error}=await supabase.auth.updateUser({password:f.get('password')});if(error)toast(error.message,'error');else{toast('Password updated.','success');closeModal()}}}
async function saveProfile(e){e.preventDefault();const f=new FormData(e.currentTarget),payload={full_name:f.get('full_name'),phone:f.get('phone')||null,country:f.get('country'),city:f.get('city'),preferred_language:f.get('preferred_language'),updated_at:new Date().toISOString()};if(state.profile.role==='donor'){payload.blood_group=f.get('blood_group');payload.availability=f.get('availability');payload.matching_radius_km=Number(f.get('matching_radius_km')||25);if(state.coords){payload.latitude=state.coords.lat;payload.longitude=state.coords.lon}}setBusy(true);const{error}=await supabase.from('profiles').update(payload).eq('id',state.profile.id);setBusy(false);if(error)toast(error.message,'error');else{toast('Profile updated.','success');state.coords=null;await refreshAll()}}

function newRequestModal(){
 const myVerified=state.orgs.filter(o=>o.owner_id===state.profile.id&&o.verification_status==='verified');state.coords=null;
 showModal('Create blood request',`<form id="requestForm" class="form"><div class="notice warn">Use a real hospital/blood-centre location. Never arrange private blood collection. Final eligibility and compatibility are determined by the authorized blood service.</div><div class="row"><div class="field"><label>Blood group</label><select name="blood_group" required>${bloodOptions()}</select></div><div class="field"><label>Component</label><select name="component"><option>RBC</option><option>Platelets</option><option>Plasma</option><option>Whole blood</option></select></div></div><div class="row"><div class="field"><label>Units</label><input type="number" name="units" min="1" max="20" value="1" required></div><div class="field"><label>Urgency</label><select name="urgency"><option value="critical">Critical</option><option value="urgent" selected>Urgent</option><option value="standard">Standard</option></select></div></div><div class="field"><label>Hospital / blood centre</label><input name="hospital_name" required maxlength="180"></div><div class="row"><div class="field"><label>Country</label><input name="country" required value="${esc(state.profile.country)}"></div><div class="field"><label>City</label><input name="city" required value="${esc(state.profile.city)}"></div></div><div class="field"><label>Verified organization (optional)</label><select name="organization_id"><option value="">Community / personal request</option>${myVerified.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="field"><label>Needed by</label><input type="datetime-local" name="needed_by" required></div><div class="field"><label>Notes (do not put sensitive patient data)</label><textarea name="notes" maxlength="500" placeholder="Ward/contact process or non-sensitive coordination notes"></textarea></div><button class="btn outline" type="button" id="requestLocation">📍 Use hospital/current location for nearby matching</button><div id="coordNote" class="muted small">Location optional; city matching is used when coordinates are absent.</div><button class="btn primary" type="submit">Publish request & alert matching donors</button></form>`);
 document.getElementById('requestLocation').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{state.coords={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('coordNote').textContent='Location captured for request matching.'},e=>toast(e.message,'error')):toast('Geolocation unavailable','error');

async function createRequest(e){e.preventDefault();const f=new FormData(e.currentTarget);const needed=new Date(f.get('needed_by'));if(!(needed>new Date()))return toast('Needed-by time must be in the future.','error');const payload={created_by:state.profile.id,organization_id:f.get('organization_id')||null,blood_group:f.get('blood_group'),component:f.get('component'),units:Number(f.get('units')),urgency:f.get('urgency'),hospital_name:f.get('hospital_name'),country:f.get('country'),city:f.get('city'),needed_by:needed.toISOString(),notes:f.get('notes')||null,latitude:state.coords?.lat??null,longitude:state.coords?.lon??null};setBusy(true);const{error}=await supabase.from('blood_requests').insert(payload);setBusy(false);if(error)return toast(error.message,'error');toast('Request published. Matching donors are being alerted in-app.','success');closeModal();state.coords=null;await refreshAll();state.view='requests';render()}
async function offerHelp(requestId){const msg=prompt('Optional short message to the requester (do not include sensitive medical data):','I am available to donate.');if(msg===null)return;const{error}=await supabase.from('donor_responses').insert({request_id:requestId,donor_id:state.profile.id,message:msg||null});if(error)toast(error.message,'error');else{toast('Your offer was sent. Your contact details remain private until accepted.','success');await refreshAll()}}

async function manageResponses(requestId){
 const rows=state.responses.filter(r=>r.request_id===requestId);const req=state.requests.find(r=>r.id===requestId);if(!rows.length)return showModal('Donor responses','<div class="empty">No donors have responded yet.</div>');
 const parts=[];for(const r of rows){let c={};const q=await supabase.rpc('response_contact',{p_response_id:r.id});if(!q.error&&q.data?.[0])c=q.data[0];const conf=state.confirmations.find(x=>x.response_id===r.id);parts.push(`<div class="list-item"><div class="between"><div><b>${esc(c.full_name||'Volunteer donor')}</b><div class="muted small">${esc(c.blood_group||req.blood_group)} • ${esc(c.city||'')} • ${esc(r.status)}</div>${r.message?`<div style="margin-top:7px">“${esc(r.message)}”</div>`:''}${c.phone?`<div class="notice good" style="margin-top:8px">Contact after acceptance: ${esc(c.phone)}</div>`:''}${conf?`<div class="notice good" style="margin-top:8px">Verified donation code: <b>${esc(conf.confirmation_code)}</b></div>`:''}</div><div class="card-actions">${r.status==='offered'?`<button class="btn success sm" data-modal-response="${r.id}|accepted">Accept</button><button class="btn outline sm" data-modal-response="${r.id}|declined">Decline</button>`:''}${['accepted','completed'].includes(r.status)?`<button class="btn outline sm" data-chat="${r.id}">Chat</button>`:''}${r.status==='accepted'?`<button class="btn sm" data-modal-response="${r.id}|completed">Mark donation complete</button>`:''}${r.status==='accepted'&&req.organization_id&&state.orgs.some(o=>o.id===req.organization_id&&o.owner_id===state.profile.id&&o.verification_status==='verified')?`<button class="btn primary sm" data-confirm-donation="${r.id}">Verify donation</button>`:''}</div></div></div>`)}
 showModal('Manage donor responses',`<div class="list">${parts.join('')}</div>`);document.querySelectorAll('[data-modal-response]').forEach(b=>b.onclick=()=>{const[id,s]=b.dataset.modalResponse.split('|');updateResponse(id,s)});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat));document.querySelectorAll('[data-confirm-donation]').forEach(b=>b.onclick=()=>confirmDonation(b.dataset.confirmDonation));
}
async function openChat(responseId){const res=state.responses.find(r=>r.id===responseId);if(!res)return;const q=await supabase.from('messages').select('*').eq('response_id',responseId).order('created_at');if(q.error)return toast(q.error.message,'error');showModal('Private coordination',`<div class="notice">Use chat only to coordinate donation through the hospital/blood centre. Avoid unnecessary patient medical information.</div><div class="chat" id="chatBox">${(q.data||[]).map(m=>`<div class="bubble ${m.sender_id===state.profile.id?'me':''}">${esc(m.body)}<time>${fmt(m.created_at)}</time></div>`).join('')||'<div class="muted small">No messages yet.</div>'}</div><form id="chatForm" class="chat-compose"><input name="body" maxlength="1500" required placeholder="Type a coordination message…"><button class="btn primary" type="submit">Send</button></form>`);const box=document.getElementById('chatBox');box.scrollTop=box.scrollHeight;document.getElementById('chatForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const{error}=await supabase.from('messages').insert({response_id:responseId,sender_id:state.profile.id,body:f.get('body').trim()});if(error)toast(error.message,'error');else openChat(responseId)}}
async function confirmDonation(responseId){if(!confirm('Confirm that this donation occurred through your verified organization?'))return;const q=await supabase.rpc('confirm_verified_donation',{p_response_id:responseId});if(q.error)return toast(q.error.message,'error');const code=q.data;showModal('Donation verified',`<div class="notice good">Donation confirmation recorded by your verified organization.</div><div class="qr-box"><div id="qrCanvas"></div><h2>${esc(code)}</h2><div class="muted small">Confirmation code</div></div>`);if(window.QRCode)new QRCode(document.getElementById('qrCanvas'),{text:`DONORLINK:${code}`,width:180,height:180});await refreshAll()}
function newOrgModal(){showModal('Register an organization',`<form id="orgForm" class="form"><div class="notice">Applications are reviewed before verification. Supply an official license/reference where applicable.</div><div class="field"><label>Organization name</label><input name="name" required maxlength="180"></div><div class="field"><label>Type</label><select name="type"><option value="hospital">Hospital</option><option value="blood_bank">Blood bank / centre</option><option value="ngo">NGO</option><option value="red_cross_red_crescent">Red Cross / Red Crescent type organization</option><option value="other">Other</option></select></div><div class="row"><div class="field"><label>Country</label><input name="country" required value="${esc(state.profile.country)}"></div><div class="field"><label>City</label><input name="city" required value="${esc(state.profile.city)}"></div></div><div class="field"><label>License / registration reference</label><input name="license_reference" maxlength="160"></div><div class="row"><div class="field"><label>Official website</label><input name="website" placeholder="https://..."></div><div class="field"><label>Official phone</label><input name="contact_phone"></div></div><button class="btn primary" type="submit">Submit for verification</button></form>`);document.getElementById('orgForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const{error}=await supabase.from('organizations').insert({owner_id:state.profile.id,name:f.get('name'),type:f.get('type'),country:f.get('country'),city:f.get('city'),license_reference:f.get('license_reference')||null,website:f.get('website')||null,contact_phone:f.get('contact_phone')||null});if(error)toast(error.message,'error');else{toast('Organization submitted for review.','success');closeModal();await refreshAll()}}}
async function reviewOrg(id,status){const note=prompt(status==='verified'?'Optional verification note:':'Reason / review note:','');if(note===null)return;const q=await supabase.rpc('admin_set_organization_status',{p_org_id:id,p_status:status,p_note:note||null});if(q.error)toast(q.error.message,'error');else{toast(`Organization ${status}.`,'success');await refreshAll()}}
function notificationsModal(){const items=state.notifications;if(!items.length)return showModal(tr('notifications'),'<div class="empty">No notifications yet.</div>');showModal(tr('notifications'),`<div class="card-actions" style="margin-bottom:10px"><button class="btn outline sm" id="markAll">Mark all read</button></div><div class="list">${items.map(n=>`<div class="list-item" style="${n.is_read?'opacity:.66':''}"><b>${esc(n.title)}</b><div>${esc(n.body)}</div><div class="muted tiny">${fmt(n.created_at)}</div></div>`).join('')}</div>`);document.getElementById('markAll').onclick=async()=>{const ids=items.filter(n=>!n.is_read).map(n=>n.id);if(!ids.length)return;const{error}=await supabase.from('notifications').update({is_read:true}).in('id',ids);if(error)toast(error.message,'error');else{await refreshAll();notificationsModal()}}}
function languageModal(){showModal('Language',`<div class="list"><button class="btn outline" data-lang="en">English</button><button class="btn outline" data-lang="hi">हिन्दी</button><button class="btn outline" data-lang="gu">ગુજરાતી</button></div>`);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=async()=>{const{error}=await supabase.from('profiles').update({preferred_language:b.dataset.lang,updated_at:new Date().toISOString()}).eq('id',state.profile.id);if(error)toast(error.message,'error');else{closeModal();await refreshAll()}})}
async function deleteAccount(){const x=prompt('This permanently deletes your DonorLink account and linked data. Type DELETE to continue:');if(x!=='DELETE')return;const q=await supabase.rpc('delete_my_account');if(q.error)return toast(q.error.message,'error');await supabase.auth.signOut();toast('Account deleted.','success')}
function showModal(title,body){modal.innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="close" data-close>✕</button></div><div class="modal-body">${body}</div></div></div>`;modal.querySelector('[data-close]').onclick=closeModal;modal.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()}}
function closeModal(){modal.innerHTML=''}
</script>
</body>
</html>
